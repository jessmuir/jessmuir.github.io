<!-- Left-aligned page name and tagline, from the page's title and subtitle.
     Used with hide-title: true and own-heading: true in the front matter. -->
<div class="home-heading page-heading-left">
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="home-tagline">{{ page.subtitle }}</p>{% endif %}
</div>
