# Press items, shown on press.md, newest first (list them in that order).
#   date: YYYY-MM-DD (only month and year are shown)
#   kind: Interview, Press release, or Artwork (shown as a small label)
#   text: a sentence or two in Markdown, links included
- date: 2026-02-01
  kind: Interview
  text: >
    I spoke to Brooks Mendenhall for an [article on Astronomy.com](https://www.astronomy.com/science/dark-energy-survey-releases-year-6-results/)
    about DES Year 6 cosmology results.

- date: 2026-01-01
  kind: Press release
  text: >
    DES Year 6 combined results from galaxy clustering and weak lensing were released.
    Here is the associated [Fermilab press release](https://news.fnal.gov/2026/01/dark-energy-survey-scientists-release-new-analysis-of-how-the-universe-expands/),
    and the [University of Cincinnati press release](https://www.uc.edu/news/articles/2026/01/uc-physicist-contributes-to-global-effort-to-unlock-mysteries-of-dark-energy.html).

- date: 2025-10-01
  kind: Interview
  text: >
    I was interviewed by Rebecca Boyle for a [Scientific American article](https://www.scientificamerican.com/article/is-dark-energy-born-inside-black-holes/)
    on testing models of dark energy.

- date: 2025-09-01
  kind: Interview
  text: >
    I was interviewed about dark energy and testing the standard cosmological model for a
    [BBC Science Focus article](https://www.sciencefocus.com/space/understanding-nothingness-might-explain-everything)
    by Georgina Torbet.

- date: 2025-04-01
  kind: Interview
  text: >
    I was interviewed about recent dark energy results for an
    [article on Astronomy.com](https://www.astronomy.com/science/dark-energy-may-be-changing-over-time/)
    by Mackenzie White.

- date: 2025-03-01
  kind: Press release
  text: >
    Cosmology results from expansion history probes (BAO and supernovae) from the completed Dark Energy Survey,
    which I contributed to obtaining and presented on behalf of the DES collaboration at the APS Global Physics Summit,
    are summarized in a [DES press release](https://www.darkenergysurvey.org/a-new-study-reveals-potential-inconsistencies-in-the-current-standard-cosmological-paradigm/)
    and a [NOIRLab press release](https://noirlab.edu/public/news/noirlab2513/).
    Press coverage included [phys.org](https://phys.org/news/2025-03-latest-dark-energy-survey-variations.html)
    and [IFLScience](https://www.iflscience.com/dark-energy-might-be-changing-this-is-what-it-means-for-our-understanding-of-the-cosmos-78554).

- date: 2024-08-01
  kind: Interview
  text: >
    I was interviewed by Rebecca Boyle for a [Scientific American article](https://www.scientificamerican.com/article/dark-energy-measurements-suggest-the-universe-might-be-way-weirder-than-we/)
    reporting on models of dark energy beyond the cosmological constant.

- date: 2024-05-01
  kind: Artwork
  text: >
    My artwork was featured in an [article on recent cosmology results](https://lsa.umich.edu/lsa/news-events/lsa-magazine/spring-2024/more-stories/shedding-light-on-dark-matter-and-dark-energy.html)
    in the University of Michigan LSA alumni magazine.

- date: 2023-04-01
  kind: Press release
  text: >
    The Dark Energy Survey Year 3 beyond-LCDM key paper, which is the product of an analysis I co-led,
    was highlighted in a [Perimeter Institute press release](https://insidetheperimeter.ca/putting-dark-energy-to-the-test/).

- date: 2022-08-01
  kind: Press release
  text: >
    A [NASA JPL press release](https://www.jpl.nasa.gov/news/nasa-scientists-help-probe-dark-energy-by-testing-gravity)
    highlighted the [DES Year 3 galaxy clustering and weak lensing analysis of models beyond-LCDM](https://arxiv.org/abs/2207.05766)
    that I co-led, mentioning the plenary talk I gave on the study at the [COSMO'22 conference](https://indico.cern.ch/event/886404/)
    in Rio de Janeiro, Brazil.
